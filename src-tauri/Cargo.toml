[package]
name = "nce-studyfree"
version = "0.3.0"
description = "新概念英语 1–4 本地学习站（Android / macOS / Web 跨端壳）"
authors = ["CencyZp"]
edition = "2021"

[lib]
name = "nce_studyfree_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-window-state = "2"
tauri-plugin-nce-tts = { path = "plugins/nce-tts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
